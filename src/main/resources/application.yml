# =============================================================
# Marriage Bio-Data Maker - Application Configuration
# =============================================================

spring:
  application:
    name: Marriage Bio-Data Maker

  # Default profile
  profiles:
    active: dev

  # Thymeleaf Configuration
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML

  # Servlet Configuration
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  # Flyway is only used by the prod (PostgreSQL) profile; dev relies on H2 + Hibernate DDL.
  flyway:
    enabled: false

# Server Configuration (for Tomcat connector maxPostSize)
server:
  tomcat:
    max-http-form-post-size: 50MB
    max-swallow-size: 50MB

  # Security - OAuth2 Configuration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

# Application Custom Properties
app:
  name: Marriage Bio-Data Maker
  version: 1.0.0
  # Base URL of this API (used to build absolute URLs for uploaded photos / QR image)
  base-url: ${APP_BASE_URL:http://localhost:8081}
  # URL of the React SPA (used for CORS and the OAuth2 login redirect)
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  jwt:
    # Base64 or plain secret, min 32 bytes for HS256. MUST be overridden in production.
    secret: ${JWT_SECRET:change-me-in-production-this-needs-to-be-at-least-32-bytes-long}
    # Access token lifetime in milliseconds (default 7 days)
    expiration: ${JWT_EXPIRATION:604800000}
  upload:
    path: ${UPLOAD_PATH:./uploads}
  payment:
    qr-code-path: /images/payment_qr.png
    upi-id: ${UPI_ID:example@upi}

# Razorpay payment gateway. All three values come from the Razorpay dashboard and
# MUST be supplied via environment variables in every real deployment.
razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  # The secret you type into Dashboard -> Webhooks (separate from key-secret).
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  currency: INR

# Logging Configuration
logging:
  level:
    root: INFO
    com.biodatamaker: DEBUG
    org.springframework.security: DEBUG

---
# =============================================================
# Development Profile (H2 Database)
# =============================================================
spring:
  config:
    activate:
      on-profile: dev

  # H2 Database Configuration
  datasource:
    # NOTE: H2 file DB allows only ONE process at a time. If you see
    # "Database may be already in use", kill the other Spring Boot / IDE run.
    url: jdbc:h2:file:./data/biodata_dev;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # H2 Console
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  # JPA Configuration for H2
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Dev Server Configuration (Docker/Render override the port via -Dserver.port=$PORT)
server:
  port: 8081

---
# =============================================================
# Production Profile (PostgreSQL Database)
# =============================================================
spring:
  config:
    activate:
      on-profile: prod

  # PostgreSQL Database Configuration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/biodata_db}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}

  # Hibernate builds/updates the schema from the entities (same as dev). Flyway is
  # disabled until there is a full baseline migration to hand it a fresh DB — the
  # ALTER-only V1 script cannot bootstrap an empty database.
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    baseline-version: 0

  # H2 Console disabled in production
  h2:
    console:
      enabled: false

  # JPA Configuration for PostgreSQL
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # `update` so an empty database is bootstrapped and new entity columns are
      # added automatically. Override with DDL_AUTO=validate once Flyway owns it.
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # Thymeleaf caching enabled in production
  thymeleaf:
    cache: true

# Production Server Configuration
server:
  port: ${PORT:8081}

# Production Logging
logging:
  level:
    root: WARN
    com.biodatamaker: INFO
    org.springframework.security: WARN
